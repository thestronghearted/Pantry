name: CI

# Runs on every pull request, and is reused by the deploy workflow so main is always tested before it ships.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pantry_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to an empty database and roll back cleanly
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic downgrade base
      - run: pytest tests -q

  responder:
    name: Responder agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: responder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: responder/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/observability:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
      - run: docker run --rm -v "$PWD/observability:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts_test.yml

  system:
    name: Whole system starts with one command
    runs-on: ubuntu-latest
    needs: [backend, responder, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid with the example environment
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build images and start app + database
        run: docker compose up -d --build db app
      - name: App answers and serves the UI
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/ready && break || sleep 3
          done
          curl -fsS http://localhost:8080/ready
          curl -fsS http://localhost:8080/ | grep -q "<title>Pantry Plan</title>"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
