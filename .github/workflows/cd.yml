name: CD

# main -> test -> build one image tagged with the commit -> deploy to dev automatically
#      -> wait for a reviewer to approve the "prod" environment -> promote the SAME image to prod.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="sha-${GITHUB_SHA::7}"
          echo "image=ghcr.io/${repo}-app" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to dev (automatic)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy image ${{ needs.build.outputs.tag }}
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          BASE_URL: ${{ vars.DEV_URL }}
        run: bash scripts/ci/deploy.sh

  deploy-prod:
    name: Deploy to prod (manual approval)
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in GitHub: Settings -> Environments -> prod.
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote image ${{ needs.build.outputs.tag }} (the one dev ran)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          BASE_URL: ${{ vars.PROD_URL }}
        run: bash scripts/ci/deploy.sh
