groups:
  - name: user-impact
    rules:
      # Pages on what users feel, not on CPU or memory: real shopping-list requests failing with a server error.
      # Synthetic probe traffic (synthetic="true") is excluded so the responder's own probes never raise or sustain the alert.
      # 4xx responses are the user's mistake and are labelled client_error, so they do not count.
      - alert: ShoppingListFailureRate
        expr: |
          (
            sum(rate(journey_requests_total{journey="shopping_list",outcome="error",synthetic="false"}[2m]))
            /
            sum(rate(journey_requests_total{journey="shopping_list",synthetic="false"}[2m]))
          ) > 0.05
          and
          sum(rate(journey_requests_total{journey="shopping_list",synthetic="false"}[2m])) > 0.02
        for: 30s
        labels:
          severity: page
          journey: shopping_list
        annotations:
          summary: "Families cannot get their shopping list"
          description: >-
            More than 5% of real shopping-list requests failed with a server error over the last 2 minutes
            (current ratio {{ $value | humanizePercentage }}).
          runbook: "docs/RUNBOOK.md#shoppinglistfailurerate"
